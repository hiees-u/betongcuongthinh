name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy folder
        run: |
          mkdir deploy-temp

          cp index.html deploy-temp/
          cp lien-he.html deploy-temp/
          cp san-pham.html deploy-temp/

          # Copy CSS, JS, IMAGES
          cp -r Content deploy-temp/
          cp -r Scripts deploy-temp/

          # Copy upload images (nếu site có dùng)
          if [ -d upload ]; then
            cp -r upload deploy-temp/
          fi

          cp -r betongcuongthinh-mirror/admin.betongcuongthinh.com/upload deploy-temp/

          # Copy .htaccess nếu có
          cp .htaccess deploy-temp/ 2>/dev/null || true

          # Bắt buộc cho GitHub Pages để không xóa folder bắt đầu bằng _
          touch deploy-temp/.nojekyll

      - name: Deploy với gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy-temp
          publish_branch: gh-pages
          force_orphan: true
