name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # cho phép chạy thủ công nếu cần

jobs:
  deploy:
    environment:
      name: github-pages      # ← Dòng bắt buộc phải có
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Disable Jekyll
        run: touch ./betongcuongthinh-mirror/betongcuongthinh.com/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./betongcuongthinh-mirror/betongcuongthinh.com

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4   # sẽ tự tạo environment github-pages nếu chưa có