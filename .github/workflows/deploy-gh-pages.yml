name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy folder
        run: |
          mkdir deploy-temp

          cp index.html deploy-temp/
          cp lien-he.html deploy-temp/
          cp san-pham.html deploy-temp/
          cp coc-be-tong-ly-tam-ung-luc-truoc-pd27ef0e4b72e7b.html deploy-temp/

          # Copy CSS, JS, IMAGES
          cp -r Content deploy-temp/
          cp -r Scripts deploy-temp/
          cp -r banner deploy-temp/
          cp -r blog deploy-temp/
          cp -r brand-logo deploy-temp/
          cp -r files deploy-temp/
          cp -r icon deploy-temp/
          cp -r logo deploy-temp/
          cp -r product deploy-temp/

          # Copy .htaccess nếu có
          cp .htaccess deploy-temp/ 2>/dev/null || true

          # Bắt buộc cho GitHub Pages
          touch deploy-temp/.nojekyll

      - name: Deploy với gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy-temp
          publish_branch: gh-pages
          force_orphan: true
