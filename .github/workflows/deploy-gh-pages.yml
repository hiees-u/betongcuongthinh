name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tạo file .nojekyll để GitHub Pages không bỏ qua các file bắt đầu bằng _
      - name: Disable Jekyll
        run: touch ./betongcuongthinh-mirror/betongcuongthinh.com/.nojekyll

      # Upload đúng thư mục đã có sẵn file HTML tĩnh
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Đây là dòng quan trọng nhất!
          path: ./betongcuongthinh-mirror/betongcuongthinh.com

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4