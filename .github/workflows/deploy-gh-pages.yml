name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy folder
        run: |
          mkdir deploy-temp

          # Copy các file HTML chính
          cp index.html deploy-temp/
          cp lien-he.html deploy-temp/
          cp san-pham.html deploy-temp/

          # Copy thư mục Content và Scripts
          cp -r Content deploy-temp/
          cp -r Scripts deploy-temp/

          # Copy .htaccess nếu có
          cp .htaccess deploy-temp/ 2>/dev/null || true

          # Tạo .nojekyll để GitHub Pages không bỏ file dạng _
          touch deploy-temp/.nojekyll

      - name: Deploy với peaceiris
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy-temp
          publish_branch: gh-pages
          force_orphan: true
